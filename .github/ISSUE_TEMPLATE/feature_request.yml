name: 功能建议 / Feature request
description: 建议新功能或改进 / Suggest a new feature or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem
      description: 你在做什么时遇到了限制？ / What are you trying to do that is hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 / Proposal
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案 / Alternatives considered
